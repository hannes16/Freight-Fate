name: Fork snapshot from upstream 1.9

# Keep this workflow on the fork's default branch. Scheduled workflows are
# loaded from the default branch even though the game source below comes from
# the upstream 1.9 branch.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-upstream-snapshot
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UPSTREAM_REPOSITORY: Orinks/Freight-Fate
  UPSTREAM_BRANCH: feat/career-1.9
  UPDATE_REPOSITORY: hannes16/Freight-Fate

jobs:
  prepare:
    name: Pull upstream source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.source.outputs.should_build }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      previous_sha: ${{ steps.source.outputs.previous_sha }}
      previous_tag: ${{ steps.source.outputs.previous_tag }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Check out the upstream 1.9 branch
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record the upstream source commit
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SOURCE_SHA=$(git rev-parse HEAD)
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          # The newest successful fork snapshot is the baseline for the
          # player-facing notes generated by upstream's release_notes.py.
          RELEASES=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,body,isPrerelease || echo '[]')
          PREVIOUS_RELEASE=$(jq -c \
            '[.[] | select(.isPrerelease and (.tagName | startswith("nightly-")))][0] // {}' \
            <<< "$RELEASES")
          PREVIOUS_TAG=$(jq -r '.tagName // ""' <<< "$PREVIOUS_RELEASE")
          PREVIOUS_BODY=$(jq -r '.body // ""' <<< "$PREVIOUS_RELEASE")
          PREVIOUS_SHA=$(grep -Eom1 \
            'upstream-source-sha: [0-9a-fA-F]{40}|/commit/[0-9a-fA-F]{40}' \
            <<< "$PREVIOUS_BODY" | grep -Eo '[0-9a-fA-F]{40}$' || true)
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_sha=${PREVIOUS_SHA,,}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            if [[ "${PREVIOUS_SHA,,}" == "$SOURCE_SHA" ]]; then
              echo "Upstream has not changed since the previous snapshot."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

  build:
    name: Build Windows snapshot
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact upstream commit
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1
          # Keep the pointers so the next step can verify every downloaded or
          # restored pack against the exact upstream commit being built.
          lfs: false
          persist-credentials: false

      - name: Fetch or restore verified sound packs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $packNames = @("sounds.pak", "music.pak")
          $expected = @{}

          foreach ($name in $packNames) {
            $path = Join-Path $env:GITHUB_WORKSPACE "src\freight_fate\$name"
            $pointer = Get-Content -LiteralPath $path -Raw
            if ($pointer -notmatch "oid sha256:([0-9a-f]{64})") {
              throw "$name is not a Git LFS pointer; refusing an ambiguous restore."
            }
            $expectedHash = $Matches[1]
            if ($pointer -notmatch "(?m)^size ([0-9]+)$") {
              throw "$name has no size in its Git LFS pointer."
            }
            $expected[$name] = @{
              Hash = $expectedHash
              Size = [int64]$Matches[1]
            }
          }

          git lfs pull origin --include="src/freight_fate/sounds.pak,src/freight_fate/music.pak" --exclude=""
          $lfsExitCode = $LASTEXITCODE

          if ($lfsExitCode -eq 0) {
            $packSource = "the current upstream Git LFS objects"
          } else {
            Write-Warning "Upstream Git LFS download failed; trying the last fork snapshot."
            $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=20" |
              ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) {
              throw "Could not list releases in $env:GITHUB_REPOSITORY."
            }
            $release = $releases |
              Where-Object {
                $_.prerelease -and
                ($_.assets | Where-Object { $_.name -like "*-windows-portable.zip" })
              } |
              Select-Object -First 1
            if (-not $release) {
              throw "No previous Windows snapshot is available to restore sound packs from."
            }

            $downloadDir = Join-Path $env:RUNNER_TEMP "previous-snapshot"
            $unpackDir = Join-Path $env:RUNNER_TEMP "previous-snapshot-unpacked"
            New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
            gh release download $release.tag_name --repo $env:GITHUB_REPOSITORY --pattern "*-windows-portable.zip" --dir $downloadDir
            if ($LASTEXITCODE -ne 0) {
              throw "Could not download the previous Windows snapshot."
            }

            $archive = Get-ChildItem -LiteralPath $downloadDir -Filter "*.zip" |
              Select-Object -First 1
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $unpackDir

            foreach ($name in $packNames) {
              $source = Join-Path $unpackDir "FreightFate\freight_fate\$name"
              $destination = Join-Path $env:GITHUB_WORKSPACE "src\freight_fate\$name"
              if (-not (Test-Path -LiteralPath $source)) {
                throw "The previous snapshot does not contain $name."
              }
              Copy-Item -LiteralPath $source -Destination $destination -Force
            }
            $packSource = "fork snapshot $($release.tag_name)"
          }

          foreach ($name in $packNames) {
            $destination = Join-Path $env:GITHUB_WORKSPACE "src\freight_fate\$name"
            $actual = Get-Item -LiteralPath $destination
            $actualHash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLower()
            if ($actual.Length -ne $expected[$name].Size -or
                $actualHash -ne $expected[$name].Hash) {
              throw "$name from $packSource does not match the current upstream LFS pointer. Upstream likely changed the sound packs while its LFS download is unavailable; refusing to publish stale audio."
            }
            Write-Host "Verified $name from $packSource."
          }

      - name: Point this packaged copy at fork releases
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ env.UPDATE_REPOSITORY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("src/freight_fate/updater.py")
          text = path.read_text(encoding="utf-8")

          old_repository = 'REPO = "Orinks/Freight-fate"'
          new_repository = f'REPO = "{os.environ["EXPECTED_REPOSITORY"]}"'
          if text.count(old_repository) != 1:
              raise SystemExit("Could not safely locate the upstream updater repository setting")
          text = text.replace(old_repository, new_repository)

          # A fork snapshot can be rebuilt more than once on the same day.
          # Teach this packaged copy to recognize the timestamped tag while
          # retaining compatibility with upstream's daily nightly tags.
          old_pattern = 'm = re.fullmatch(r"nightly-(\\d{8})", tag)'
          new_pattern = 'm = re.fullmatch(r"nightly-(\\d{8})(?:-\\d{6})?", tag)'
          if old_pattern in text:
              text = text.replace(old_pattern, new_pattern, 1)
          elif new_pattern not in text:
              raise SystemExit("Could not safely update the nightly tag parser")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: uv sync --group build

      - name: Verify the personalized update source
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ env.UPDATE_REPOSITORY }}
        run: |
          uv run python - <<'PY'
          import os
          from freight_fate import updater

          assert updater.REPO == os.environ["EXPECTED_REPOSITORY"]
          build = updater.build_info_from_dict(
              {"tag": "nightly-20260822-120000"}, "1.9.0.dev0"
          )
          assert build.channel == "dev"
          PY

      - name: Check release dependencies
        run: uv run python tools/build_release.py --check-dependencies

      - name: Build snapshot
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          FREIGHT_FATE_NO_SPEECH: "1"
        run: >
          uv run python tools/build_release.py
          --tag "${{ needs.prepare.outputs.tag }}"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: Windows
          path: dist/FreightFate-*-windows-portable.zip
          if-no-files-found: error

  release:
    name: Publish snapshot in this fork
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out upstream history for the changelog
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Download platform archives
        uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: Verify archives and write release notes
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PREVIOUS_SHA: ${{ needs.prepare.outputs.previous_sha }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          SOURCE_BRANCH: ${{ env.UPSTREAM_BRANCH }}
          UPSTREAM_REPOSITORY: ${{ env.UPSTREAM_REPOSITORY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! ls assets/FreightFate-*-windows-portable.zip >/dev/null 2>&1; then
            echo "Missing Windows portable archive" >&2
            exit 1
          fi

          (cd assets && sha256sum * > checksums.txt)
          : > previous-notes.md
          if [[ -n "$PREVIOUS_TAG" ]]; then
            gh release view "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" \
              --json body --jq .body > previous-notes.md || true

            # Re-read the source SHA here instead of trusting only a cross-job
            # output. Without a usable baseline release_notes.py deliberately
            # emits every unreleased entry, which can exceed GitHub's body limit.
            if [[ -z "$PREVIOUS_SHA" ]]; then
              PREVIOUS_SHA=$(grep -Eom1 \
                'upstream-source-sha: [0-9a-fA-F]{40}|/commit/[0-9a-fA-F]{40}' \
                previous-notes.md | grep -Eo '[0-9a-fA-F]{40}$' || true)
            fi
            if [[ -z "$PREVIOUS_SHA" ]]; then
              echo "Could not recover the upstream SHA from snapshot $PREVIOUS_TAG" >&2
              exit 1
            fi
          fi

          : > latest-stable-notes.md
          LATEST_STABLE_TAG=$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" \
            --jq .tag_name 2>/dev/null || true)
          if [[ -n "$LATEST_STABLE_TAG" ]]; then
            gh release view "$LATEST_STABLE_TAG" --repo "$UPSTREAM_REPOSITORY" \
              --json body --jq .body > latest-stable-notes.md || true
          fi

          BASE_ARGS=()
          if [[ -n "$PREVIOUS_SHA" ]]; then
            git fetch --no-tags origin "$PREVIOUS_SHA"
            # release_notes.py treats an unreadable historical changelog as an
            # empty baseline. Prove the blob is materialized before invoking it
            # so a partial checkout cannot advertise the entire changelog.
            git show "${PREVIOUS_SHA}:CHANGELOG.md" >/dev/null
            BASE_ARGS=(--previous-tag "$PREVIOUS_SHA")
          fi

          python3 tools/release_notes.py nightly \
            "${BASE_ARGS[@]}" \
            --exclude-notes previous-notes.md \
            --exclude-stable-notes latest-stable-notes.md \
            --output notes.md

          NOTES_BYTES=$(wc -c < notes.md)
          if (( NOTES_BYTES > 120000 )); then
            echo "Generated release notes are unexpectedly large: ${NOTES_BYTES} bytes" >&2
            exit 1
          fi
          echo "Generated ${NOTES_BYTES} bytes of updater-compatible release notes."

          SHORT_SHA=${SOURCE_SHA:0:12}
          {
            echo
            echo "---"
            echo "Fork snapshot source: [\`${SHORT_SHA}\`](https://github.com/${UPSTREAM_REPOSITORY}/commit/${SOURCE_SHA}) on \`${SOURCE_BRANCH}\`."
            echo "This release belongs to the fork and does not modify upstream."
          } >> notes.md

      - name: Create prerelease in this fork
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Personal developer snapshot $(date -u +%Y-%m-%d)" \
            --notes-file notes.md \
            --prerelease
